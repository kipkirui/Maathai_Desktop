[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: fast unit tests that do not require the model
    inference: tests that load the GGUF model
    rag: tests that require the knowledge base
    offline: tests that verify network isolation
    accuracy: domain accuracy tests on competition prompts
    perf: performance regression tests (TPS, RAM)
    submission: final pre-submission validation gate
